[package]
name = "cloudscanner"
version = "0.1.0"
edition = "2021"

[workspace]
# This empty workspace table excludes this package from any parent workspace

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
libloading = "0.8"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
aws-config = "1.0"
aws-sdk-ec2 = "1.0"
aws-sdk-s3 = "1.0"
aws-sdk-iam = "1.0"
aws-types = "1.0"
aws-smithy-types = "1.0"

[dev-dependencies]
tempfile = "3.0"
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
serial_test = "2.0"
